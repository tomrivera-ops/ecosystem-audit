name: Ecosystem Drift Gate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-gate:
    name: nightly fleet drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FARADAY_APP_ID }}
          private-key: ${{ secrets.FARADAY_APP_PRIVATE_KEY }}
          owner: >-
            faraday-platform,
            faraday-studio,
            faraday-accounting-control-panel-facp,
            faraday-build,
            faraday-beacon,
            faraday-capital-systems,
            orbitconsole,
            signal-interface,
            tomrivera-PSE,
            tomrivera-ops

      - name: Authenticate gh for fleet clone
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth login --with-token <<< "$GH_TOKEN"
          gh auth status

      - name: Enumerate and shallow-clone fleet
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ./roster.sh list
          ./roster.sh deep

      - name: Coupling scan
        run: node coupling-scan.js repos

      - name: Drift gate (fail on new drift)
        run: node drift-gate.js repos

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-scan-${{ github.run_id }}
          path: |
            ecosystem-inventory/_coupling.yaml
            ecosystem-inventory/_coupling.json
          retention-days: 14
