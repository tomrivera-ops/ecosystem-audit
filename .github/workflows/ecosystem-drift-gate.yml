name: Ecosystem Drift Gate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-gate:
    name: nightly fleet drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate per-org app tokens
        env:
          APP_ID: ${{ secrets.FARADAY_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FARADAY_APP_PRIVATE_KEY }}
        run: |
          pip install PyJWT cryptography --quiet
          python3 << 'PYEOF'
          import jwt, time, json, urllib.request, os, sys

          app_id = os.environ['APP_ID']
          private_key = os.environ['APP_PRIVATE_KEY']

          payload = {
              'iat': int(time.time()) - 60,
              'exp': int(time.time()) + 600,
              'iss': app_id
          }
          app_jwt = jwt.encode(payload, private_key, algorithm='RS256')

          def gh_api(url, method='GET'):
              req = urllib.request.Request(
                  url, method=method,
                  headers={
                      'Authorization': f'Bearer {app_jwt}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28'
                  }
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          installations = gh_api('https://api.github.com/app/installations')
          org_tokens = {}
          for inst in installations:
              org = inst['account']['login']
              inst_id = inst['id']
              try:
                  resp = gh_api(
                      f'https://api.github.com/app/installations/{inst_id}/access_tokens',
                      method='POST'
                  )
                  org_tokens[org] = resp['token']
                  print(f'  token ok: {org}', file=sys.stderr)
              except Exception as e:
                  print(f'  token FAILED: {org} — {e}', file=sys.stderr)

          with open('/tmp/org-tokens.json', 'w') as f:
              json.dump(org_tokens, f)
          print(f'Tokens generated for {len(org_tokens)} orgs', file=sys.stderr)
          PYEOF

      - name: Enumerate and clone fleet
        env:
          ORG_TOKENS_FILE: /tmp/org-tokens.json
        run: |
          ./roster.sh list
          ./roster.sh deep

      - name: Coupling scan
        run: node coupling-scan.js repos

      - name: Drift gate (fail on new drift)
        run: node drift-gate.js repos

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-scan-${{ github.run_id }}
          path: |
            ecosystem-inventory/_coupling.yaml
            ecosystem-inventory/_coupling.json
          retention-days: 14
