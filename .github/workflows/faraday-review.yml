name: faraday-review

# Faraday Review Phase 1 SHADOW enrollment (GHO-AUTONOMOUS-BUILD-003 / P2).
# Observation only: posts one governed summary check + comment and uploads
# decision/telemetry artifacts. It approves nothing and merges nothing, and
# it is NOT a required status check (only `required-checks` is required).
#
# Activation is off until the repository variable
# FARADAY_REVIEW_SHADOW_ENABLED is set to "true" (founder/operator action,
# after the reusable workflow is merged and the SHA below is updated to that
# merge commit). The reusable workflow itself refuses any reviewer SHA that
# is not on faraday-review main.
#
# REVIEWER_SHA (both places) = faraday-build/faraday-review PR #7 merge commit
# b9002669fcc71f347f2cd91d4999a9b48fe4db78 on main (merged 2026-11-14).
# #7 carries agent-contracts v0.4.0 execution identity (event_id, execution
# run_id/run_attempt) on top of the PR #4 reusable workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: faraday-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  faraday-review:
    if: vars.FARADAY_REVIEW_SHADOW_ENABLED == 'true'
    # REVIEWER_SHA = faraday-review main merge commit of PR #7
    uses: faraday-build/faraday-review/.github/workflows/shadow.yml@b9002669fcc71f347f2cd91d4999a9b48fe4db78
    with:
      reviewer_sha: b9002669fcc71f347f2cd91d4999a9b48fe4db78
      governance_sha: 1b98ab9b4aa13a0d481ef47972de62c3782e9f2a # faraday-governance v1.1.0
      policy_digest: ${{ vars.FARADAY_POLICY_DIGEST }}
      required_checks: |
        required-checks
